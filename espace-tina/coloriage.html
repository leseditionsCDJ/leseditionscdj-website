<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Coloriage de Tina | Les Éditions Cap Découvertes Jeunesse
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #203040;

            background:
                linear-gradient(
                    180deg,
                    #EAF6FC 0%,
                    #FFFDF7 100%
                );

            min-height: 100vh;
        }


        /* =========================
           EN-TÊTE
        ========================== */

        header {
            background-color: white;

            padding: 15px 5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            border-bottom:
                2px solid #E7EEF3;
        }

        .logo {
            width: 220px;

            max-width: 45vw;

            height: auto;
        }

        .back-button {
            background-color: #174E78;

            color: white;

            padding: 12px 20px;

            border-radius: 25px;

            text-decoration: none;

            font-weight: bold;

            transition: 0.2s;
        }

        .back-button:hover {
            background-color: #2F8F46;
        }


        /* =========================
           CONTENU
        ========================== */

        main {
            width: 95%;

            max-width: 1250px;

            margin: auto;

            padding:
                45px 15px 70px;

            text-align: center;
        }

        h1 {
            margin:
                0 0 10px;

            color: #174E78;

            font-size: 2.7rem;
        }

        .intro {
            max-width: 760px;

            margin:
                0 auto 30px;

            color: #536B7B;

            font-size: 1.15rem;

            line-height: 1.6;
        }


        /* =========================
           PALETTE
        ========================== */

        .color-panel {
            background-color: white;

            max-width: 900px;

            margin:
                0 auto 25px;

            padding: 22px;

            border-radius: 25px;

            border:
                2px solid #DDECF3;

            box-shadow:
                0 10px 25px
                rgba(23, 78, 120, 0.08);
        }

        .color-panel h2 {
            margin:
                0 0 15px;

            color: #2F8F46;

            font-size: 1.35rem;
        }

        .colors {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 12px;
        }

        .color {
            width: 46px;

            height: 46px;

            border-radius: 50%;

            border:
                3px solid white;

            outline:
                2px solid #CBD8DF;

            cursor: pointer;

            transition: 0.15s;

            position: relative;
        }

        .color:hover {
            transform:
                scale(1.12);
        }

        .color.selected {
            outline:
                4px solid #174E78;

            transform:
                scale(1.12);
        }

        .color.selected::after {
            content: "✓";

            position: absolute;

            inset: 0;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 1.3rem;

            font-weight: bold;

            color: white;

            text-shadow:
                0 1px 3px
                rgba(0,0,0,0.7);
        }


        /* =========================
           DESSIN
        ========================== */

        .drawing-card {
            background-color: white;

            padding: 15px;

            border-radius: 25px;

            border:
                2px solid #DDECF3;

            box-shadow:
                0 15px 35px
                rgba(23, 78, 120, 0.10);

            max-width: 1150px;

            margin: auto;
        }

        .artboard {
            position: relative;

            width: 100%;

            max-width: 1050px;

            margin: auto;

            aspect-ratio:
                1426 / 1103;

            background: white;

            border-radius: 16px;

            overflow: hidden;
        }

        #zones-svg,
        #lineart {
            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            display: block;
        }

        #zones-svg {
            z-index: 1;

            background: white;
        }

        #lineart {
            z-index: 2;

            pointer-events: none;

            mix-blend-mode: multiply;

            user-select: none;

            -webkit-user-drag: none;
        }

        .zone {
            fill: #FFFFFF;

            stroke: none;

            cursor: pointer;
        }


        /* =========================
           BOUTONS
        ========================== */

        .tools {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 12px;

            margin-top: 25px;
        }

        .tool-button {
            border: none;

            border-radius: 25px;

            padding: 13px 20px;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .tool-button:hover {
            transform:
                translateY(-1px);
        }

        .undo {
            background-color: #F1B83B;

            color: #263238;
        }

        .eraser {
            background-color: #E7EEF3;

            color: #174E78;
        }

        .restart {
            background-color: #D95C5C;

            color: white;
        }

        .print {
            background-color: #174E78;

            color: white;
        }

        .save {
            background-color: #2F8F46;

            color: white;
        }

        #message {
            min-height: 28px;

            margin-top: 18px;

            color: #2F8F46;

            font-weight: bold;
        }

        .tip {
            margin:
                20px auto 0;

            max-width: 800px;

            color: #667C89;

            line-height: 1.5;

            font-size: 0.95rem;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            header {
                flex-direction: column;
            }

            h1 {
                font-size: 2rem;
            }

            .color {
                width: 40px;

                height: 40px;
            }

            .drawing-card {
                padding: 8px;
            }

            .tool-button {
                flex-grow: 1;

                min-width: 145px;
            }

        }


        /* =========================
           IMPRESSION
        ========================== */

        @media print {

            @page {
                size: letter landscape;

                margin: 0.5in;
            }

            body * {
                visibility: hidden;
            }

            .artboard,
            .artboard * {
                visibility: visible;
            }

            .artboard {
                position: absolute;

                left: 0;

                top: 0;

                width: 100%;

                max-width: none;
            }

        }

    </style>
</head>

<script>


    /* =========================
       VARIABLES
    ========================== */

    const DEFAULT_COLOR =
        "#EF4444";


    let selectedColor =
        DEFAULT_COLOR;


    let history = [];


    const colorButtons =
        document.querySelectorAll(
            ".color"
        );


    const zones =
        document.querySelectorAll(
            ".zone"
        );


    const lineart =
        document.getElementById(
            "lineart"
        );


    /* =========================
       MESSAGE
    ========================== */

    function showMessage(text) {

        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            text;


        clearTimeout(
            showMessage.timer
        );


        showMessage.timer =
            setTimeout(
                function() {

                    message.textContent =
                        "";

                },
                3000
            );

    }


    /* =========================
       PALETTE
    ========================== */

    colorButtons.forEach(
        function(button) {


            button.addEventListener(
                "click",
                function() {


                    colorButtons.forEach(
                        function(item) {

                            item.classList.remove(
                                "selected"
                            );

                        }
                    );


                    button.classList.add(
                        "selected"
                    );


                    selectedColor =
                        button.dataset.color;


                }
            );


        }
    );


    /* =========================
       COLORIER UNE ZONE
    ========================== */

    zones.forEach(
        function(zone) {


            zone.addEventListener(
                "click",
                function() {


                    const previousFill =
                        zone.style.fill ||
                        "#FFFFFF";


                    /*
                       On évite de créer
                       une action inutile
                       si la zone possède
                       déjà cette couleur.
                    */

                    if (
                        previousFill.toLowerCase() ===
                        selectedColor.toLowerCase()
                    ) {

                        return;

                    }


                    history.push({

                        id:
                            zone.id,

                        previousFill:
                            previousFill

                    });


                    if (
                        history.length > 50
                    ) {

                        history.shift();

                    }


                    /*
                       IMPORTANT :
                       style.fill remplace
                       correctement la couleur
                       définie dans le CSS.
                    */

                    zone.style.fill =
                        selectedColor;


                    showMessage(
                        "Jolie couleur ! ✨"
                    );


                }
            );


        }
    );


    /* =========================
       ANNULER
    ========================== */

    document.getElementById(
        "undo-button"
    ).addEventListener(
        "click",
        function() {


            if (
                history.length === 0
            ) {

                showMessage(
                    "Il n'y a rien à annuler."
                );

                return;

            }


            const lastAction =
                history.pop();


            const zone =
                document.getElementById(
                    lastAction.id
                );


            zone.style.fill =
                lastAction.previousFill;


            showMessage(
                "Dernière action annulée. ↩️"
            );


        }
    );


    /* =========================
       EFFACER UNE ZONE
    ========================== */

    document.getElementById(
        "eraser-button"
    ).addEventListener(
        "click",
        function() {


            selectedColor =
                "#FFFFFF";


            colorButtons.forEach(
                function(item) {

                    item.classList.remove(
                        "selected"
                    );

                }
            );


            showMessage(
                "🧽 Clique sur la zone que tu veux effacer."
            );


        }
    );


    /* =========================
       RECOMMENCER
    ========================== */

    document.getElementById(
        "restart-button"
    ).addEventListener(
        "click",
        function() {


            const confirmation =
                confirm(
                    "Veux-tu vraiment effacer tout ton coloriage ?"
                );


            if (
                !confirmation
            ) {

                return;

            }


            zones.forEach(
                function(zone) {

                    zone.style.fill =
                        "#FFFFFF";

                }
            );


            history = [];


            selectedColor =
                DEFAULT_COLOR;


            colorButtons.forEach(
                function(item) {

                    item.classList.remove(
                        "selected"
                    );

                }
            );


            colorButtons[0]
                .classList.add(
                    "selected"
                );


            showMessage(
                "Le dessin est prêt pour un nouveau coloriage ! 🎨"
            );


        }
    );


    /* =========================
       CHARGER UNE IMAGE
    ========================== */

    function loadImage(src) {

        return new Promise(
            function(resolve, reject) {


                const img =
                    new Image();


                img.onload =
                    function() {

                        resolve(img);

                    };


                img.onerror =
                    reject;


                img.src =
                    src;


            }
        );

    }


    /* =========================
       CRÉER L'IMAGE COLORIÉE
    ========================== */

    async function generateColoredImageDataUrl() {


        const originalSvg =
            document.getElementById(
                "zones-svg"
            );


        const clonedSvg =
            originalSvg.cloneNode(
                true
            );


        clonedSvg.setAttribute(
            "xmlns",
            "http://www.w3.org/2000/svg"
        );


        /*
           Fond blanc.
        */

        const background =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "rect"
            );


        background.setAttribute(
            "x",
            "0"
        );


        background.setAttribute(
            "y",
            "0"
        );


        background.setAttribute(
            "width",
            "1426"
        );


        background.setAttribute(
            "height",
            "1103"
        );


        background.setAttribute(
            "fill",
            "#FFFFFF"
        );


        clonedSvg.insertBefore(
            background,
            clonedSvg.firstChild
        );


        const serializer =
            new XMLSerializer();


        const svgString =
            serializer.serializeToString(
                clonedSvg
            );


        const svgDataUrl =
            "data:image/svg+xml;charset=utf-8," +
            encodeURIComponent(
                svgString
            );


        const svgImage =
            await loadImage(
                svgDataUrl
            );


        const outputCanvas =
            document.createElement(
                "canvas"
            );


        outputCanvas.width =
            1426;


        outputCanvas.height =
            1103;


        const ctx =
            outputCanvas.getContext(
                "2d"
            );


        ctx.fillStyle =
            "#FFFFFF";


        ctx.fillRect(
            0,
            0,
            outputCanvas.width,
            outputCanvas.height
        );


        /*
           D'abord les couleurs.
        */

        ctx.drawImage(
            svgImage,
            0,
            0,
            outputCanvas.width,
            outputCanvas.height
        );


        /*
           Ensuite le dessin noir.
           Le mode multiply permet
           au blanc de l'image de
           devenir transparent
           visuellement tandis que
           les traits noirs restent.
        */

        ctx.globalCompositeOperation =
            "multiply";


        ctx.drawImage(
            lineart,
            0,
            0,
            outputCanvas.width,
            outputCanvas.height
        );


        ctx.globalCompositeOperation =
            "source-over";


        return outputCanvas.toDataURL(
            "image/png"
        );


    }


    /* =========================
       FENÊTRE D'IMPRESSION
    ========================== */

    function openPrintWindow(
        imageSource
    ) {


        const printWindow =
            window.open(
                "",
                "_blank"
            );


        if (
            !printWindow
        ) {

            showMessage(
                "Ton navigateur a bloqué la fenêtre d'impression."
            );

            return;

        }


        printWindow.document.write(

            <!DOCTYPE html>

    /* =========================
       IMPRIMER ORIGINAL
    ========================== */

    document.getElementById(
        "print-original-button"
    ).addEventListener(
        "click",
        function() {


            const imageUrl =
                new URL(
                    "../images/dessin_tina.png",
                    window.location.href
                ).href;


            openPrintWindow(
                imageUrl
            );


        }
    );


    /* =========================
       IMPRIMER COLORIAGE
    ========================== */

    document.getElementById(
        "print-colored-button"
    ).addEventListener(
        "click",
        async function() {


            try {


                const dataUrl =
                    await generateColoredImageDataUrl();


                openPrintWindow(
                    dataUrl
                );


            }

            catch (error) {


                showMessage(
                    "Impossible de préparer l'impression du coloriage."
                );


            }


        }
    );


    /* =========================
       ENREGISTRER
    ========================== */

    document.getElementById(
        "save-button"
    ).addEventListener(
        "click",
        async function() {


            try {


                const dataUrl =
                    await generateColoredImageDataUrl();


                const link =
                    document.createElement(
                        "a"
                    );


                link.download =
                    "mon-coloriage-de-tina.png";


                link.href =
                    dataUrl;


                link.click();


                showMessage(
                    "Ton coloriage est enregistré ! 💚"
                );


            }

            catch (error) {


                showMessage(
                    "Impossible d'enregistrer le coloriage."
                );


            }


        }
    );


</script>


</body>

</html>
