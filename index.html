<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Les Éditions Cap Découvertes Jeunesse</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f7f5ef;
            color: #333333;
            text-align: center;
        }

        .page {
            width: 90%;
            max-width: 750px;
            padding: 40px 20px;
        }

        .logo {
            width: 280px;
            max-width: 80%;
            height: auto;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.4rem;
            margin-bottom: 15px;
        }

        p {

            line-height: 1.6;
        }

<body>

    <main class="page">

        <img
            src="logo.png"
            alt="Logo des Éditions Cap Découvertes Jeunesse"
            class="logo"
        >

        <h1>Les Éditions Cap Découvertes Jeunesse</h1>

        <h2>Site en construction</h2>

        <p>
            Notre univers jeunesse prend forme.
            Revenez bientôt pour découvrir nos livres,
