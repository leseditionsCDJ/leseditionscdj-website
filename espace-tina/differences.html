<head>

        Trouve les 7 différences | Les Éditions Cap Découvertes Jeunesse
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #203040;

            background:
                linear-gradient(
                    180deg,
                    #EAF6FC 0%,
                    #FFFDF7 100%
                );

            min-height: 100vh;
        }


        /* =========================
           EN-TÊTE
        ========================== */

        header {
            background-color: white;

            padding: 15px 5%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

                2px solid #E7EEF3;
        }

        .logo {
            width: 220px;

            max-width: 45vw;

            height: auto;
        }

        .back-button {
            background-color: #174E78;

            color: white;

            padding: 12px 20px;

            border-radius: 25px;

            text-decoration: none;

            font-weight: bold;

            transition: 0.2s;
        }

        .back-button:hover {
            background-color: #2F8F46;
        }


        /* =========================
           CONTENU
        ========================== */

        main {
            width: 96%;

            max-width: 1450px;

            margin: auto;

            padding:
                40px 15px 70px;

            text-align: center;
        }

        h1 {
            margin:
                0 0 10px;

            color: #174E78;

            font-size: 2.7rem;
        }

        .intro {
            max-width: 760px;

            margin:
                0 auto 25px;

            color: #536B7B;

            font-size: 1.1rem;

            line-height: 1.6;
        }


        /* =========================
           JEU
        ========================== */

        .game-card {
            max-width: 1400px;

            margin: auto;

            padding: 15px;

            background-color: white;

            border:
                2px solid #DDECF3;

            border-radius: 25px;

            box-shadow:
                0 15px 35px
                rgba(23, 78, 120, 0.10);
        }

        .game-board {
            position: relative;

            width: 100%;

            overflow: hidden;

            border-radius: 16px;

            cursor: default;

            user-select: none;
        }

        .game-board img {
            display: block;

            width: 100%;

            height: auto;

            cursor: default;

            pointer-events: none;

            user-select: none;

            -webkit-user-drag: none;
        }


        /* =========================
           CERCLES TROUVÉS
        ========================== */

        .found-marker {
            position: absolute;

            border:
                4px solid #2F8F46;

            border-radius: 50%;

            background:
                rgba(47, 143, 70, 0.07);

            box-shadow:
                0 0 0 2px white;

            pointer-events: none;

            animation:
                markerPop 0.25s ease-out;
        }

        .found-marker::after {
            content: "✓";

            position: absolute;

            right: -9px;

            top: -12px;

            width: 25px;

            height: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            background-color: #2F8F46;

            color: white;

            border-radius: 50%;

            font-weight: bold;

            font-size: 0.95rem;
        }

        @keyframes markerPop {

            from {
                transform: scale(0.65);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }


        /* =========================
           INDICE
        ========================== */

        .hint-marker {
            position: absolute;

            border:
                5px dashed #F1B83B;

            border-radius: 50%;

            background:
                rgba(241, 184, 59, 0.13);

            pointer-events: none;

            animation:
                hintPulse 0.7s
                ease-in-out
                infinite alternate;
        }

        @keyframes hintPulse {

            from {
                opacity: 0.4;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================
           MAUVAIS CLIC
        ========================== */

        .wrong-mark {
            position: absolute;

            width: 55px;

            height: 55px;

            transform:
                translate(-50%, -50%);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #D93E3E;

            font-size: 3.2rem;

            font-weight: bold;

            pointer-events: none;

            text-shadow:
                0 2px 3px white;

            animation:
                wrongPop 0.7s ease-out forwards;
        }

        @keyframes wrongPop {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.5);
            }

            30% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }

            100% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.9);
            }

        }


        /* =========================
           INFORMATIONS
        ========================== */

        .game-info {
            max-width: 1000px;

            margin:
                25px auto 0;

            padding: 24px;

            background-color: #F7FBFD;

            border-radius: 22px;
        }

        .top-info {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            flex-wrap: wrap;
        }

        .counter {
            color: #174E78;

            font-size: 1.25rem;

            font-weight: bold;
        }

        .stars {
            font-size: 1.6rem;

            letter-spacing: 4px;
        }


        /* =========================
           PROGRESSION
        ========================== */

        .progress-track {
            width: 100%;

            height: 18px;

            margin-top: 16px;

            background-color: #DDECF3;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {
            width: 0%;

            height: 100%;

            background-color: #2F8F46;

            border-radius: inherit;

            transition:
                width 0.35s ease;
        }


        /* =========================
           LISTE
        ========================== */

        .difference-list {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 20px;
        }

        .difference-item {
            padding:
                10px 12px;

            border-radius: 15px;

            background-color: white;

            color: #617789;

            font-size: 0.95rem;

            font-weight: bold;
        }

        .difference-item.found {
            background-color: #EFF8E9;

            color: #2F8F46;
        }


        /* =========================
           MESSAGE
        ========================== */

        #message {
            min-height: 32px;

            margin-top: 18px;

            color: #174E78;

            font-size: 1.05rem;

            font-weight: bold;
        }


        /* =========================
           BOUTONS
        ========================== */

        .tools {
            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 12px;

            margin-top: 18px;
        }

        .tool-button {
            border: none;

            border-radius: 25px;

            padding:
                13px 20px;

            font-size: 1rem;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .tool-button:hover {
            transform:
                translateY(-1px);
        }

        .hint-button {
            background-color: #F1B83B;

            color: #263238;
        }

        .answers-button {
            background-color: #8B5CF6;

            color: white;
        }

        .restart-button {
            background-color: #D95C5C;

            color: white;
        }

        .sound-button {
            background-color: #174E78;

            color: white;
        }


        /* =========================
           VICTOIRE
        ========================== */

        .victory {
            display: none;

            max-width: 700px;

            margin:
                25px auto 0;

            padding: 25px;

            background-color: #EFF8E9;

            color: #2F8F46;

            border-radius: 22px;

            font-size: 1.25rem;

            font-weight: bold;
        }

        .victory.show {
            display: block;

            animation:
                markerPop 0.35s ease-out;
        }


        /* =========================
           CONFETTIS
        ========================== */

        .confetti {
            position: fixed;

            top: -20px;

            width: 10px;

            height: 16px;

            z-index: 9999;

            pointer-events: none;

            animation:
                confettiFall
                2.5s
                linear
                forwards;
        }

        @keyframes confettiFall {

            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0.2;
            }

        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 750px) {

            header {
                flex-direction: column;
            }

            h1 {
                font-size: 2rem;
            }

            .difference-list {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .game-card {
                padding: 7px;
            }

            .found-marker {
                border-width: 3px;
            }

        }

    </style>

</head>

<script>


    /* =====================================================
       DIFFÉRENCES

       hit = zone assez grande pour faciliter le clic
       marker = cercle précis qui apparaît sur la différence
    ===================================================== */


    const differences = [


        /* 1 - COUVERCLE DU POT */

                    },

                        height: 3.13

                }

            ]
        },


        /* 3 - PANNEAU DE LA PORTE */

        {
            id: "door-sign",

                "Le panneau de la porte",

            areas: [

                {
                    hit: {
                        left: 72.17,
                        top: 13.35,
                        width: 10.36,
                        height: 15.19
                    },

                    marker: {
                        left: 73.34,
                        top: 15.10,
                        width: 8.15,

                    }
                },

                {

                }

        /* 4 - POIGNÉE DE PORTE */

                {

                },

                {

                    },

                    marker: {

                        top: 70.53,
                        width: 3.38,
                        height: 5.99
                    }
                }

            ]
        },


        /* 5 - PATTE SUR L'AFFICHE */

        {
            id: "poster-paw",

            name:
                "La patte sur l'affiche",

            areas: [

                {
                    hit: {
                        left: 41.16,
                        top: 28.08,
                        width: 6.15,
                        height: 7.37
                    },

                    marker: {
                        left: 42.75,
                        top: 30.11,
                        width: 3.11,
                        height: 3.59
                    }
                },

                {
                    hit: {

                        top: 67.22,
                        width: 6.15,

                    },

                        width: 3.11,

                    }
                }

            ]
        },


        /* 6 - POT DE LA PLANTE */

        {
            id: "plant",

            name:
                "Le pot de la plante",

            areas: [

                {
                    hit: {
                        left: 52.14,
                        top: 28.55,
                        width: 6.35,
                        height: 8.47
                    },

                    marker: {
                        left: 53.66,

                        width: 3.45,

                    }
                },

                {

                        left: 52.35,
                        top: 69.34,
                        width: 6.35,

                    },

                    marker: {
                        left: 53.87,
                        top: 71.36,
                        width: 3.52,
                        height: 4.79
                    }
                }

            ]
        },


        /* 7 - PATTE SUR LE GOBELET */

        {
            id: "cup-paw",

            name:
                "La patte sur le gobelet",

            areas: [

                {
                    hit: {
                        left: 65.61,
                        top: 42.54,
                        width: 5.18,
                        height: 7.92
                    },

                    marker: {
                        left: 67.13,
                        top: 44.75,
                        width: 2.28,
                        height: 3.59
                    }
                },

                {
                    hit: {
                        left: 65.75,
                        top: 82.69,
                        width: 5.18,
                        height: 7.73
                    },

                    marker: {
                        left: 67.27,
                        top: 84.81,
                        width: 2.21,
                        height: 3.50
                    }
                }

            ]
        }

    ];


    /* =========================
       VARIABLES
    ========================== */

    const board =
        document.getElementById(
            "game-board"
        );


    const counter =
        document.getElementById(
            "counter"
        );


    const progressBar =
        document.getElementById(
            "progress-bar"
        );


    const starsDisplay =
        document.getElementById(
            "stars"
        );


    const message =
        document.getElementById(
            "message"
        );


    const victory =
        document.getElementById(
            "victory"
        );


    const differenceList =
        document.getElementById(
            "difference-list"
        );


    let found =
        new Set();


    let stars =
        3;


    let soundEnabled =
        true;


    let answersRevealed =
        false;


    let hintMarkers =
        [];


    /* =========================
       LISTE
    ========================== */

    function buildDifferenceList() {

        differenceList.innerHTML =
            "";


        differences.forEach(
            function(diff, index) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "difference-item";


                item.id =
                    "list-" +
                    diff.id;


                item.textContent =
                    "Différence " +
                    (index + 1);


                differenceList.appendChild(
                    item
                );


            }
        );

    }


    buildDifferenceList();


    /* =========================
       POSITION DU CLIC
    ========================== */

    function getClickPercent(event) {

        const rect =
            board.getBoundingClientRect();


        return {

            x:
                (
                    event.clientX -
                    rect.left
                ) /
                rect.width *
                100,


            y:
                (
                    event.clientY -
                    rect.top
                ) /
                rect.height *
                100

        };

    }


    function pointInsideArea(
        x,
        y,
        area
    ) {

        return (

            x >= area.left &&

            x <=
                area.left +
                area.width &&

            y >= area.top &&

            y <=
                area.top +
                area.height

        );

    }


    /* =========================
       CLIC
    ========================== */

    board.addEventListener(
        "pointerdown",
        function(event) {


            const point =
                getClickPercent(
                    event
                );


            let matched =
                null;


            differences.forEach(
                function(diff) {


                    if (
                        matched
                    ) {

                        return;

                    }


                    const hit =
                        diff.areas.some(
                            function(area) {


                                return pointInsideArea(
                                    point.x,
                                    point.y,
                                    area.hit
                                );


                            }
                        );


                    if (
                        hit
                    ) {


                        matched =
                            diff;


                    }


                }
            );


            /* BONNE RÉPONSE */

            if (
                matched
            ) {


                if (
                    found.has(
                        matched.id
                    )
                ) {


                    showMessage(
                        "Tu as déjà trouvé cette différence ! ✅"
                    );


                    return;


                }


                found.add(
                    matched.id
                );


                clearHints();


                addFoundMarkers(
                    matched
                );


                updateGame();


                showMessage(
                    "Bravo ! Une différence de trouvée ! ✅"
                );


                playGoodSound();


                if (
                    found.size ===
                    differences.length &&
                    !answersRevealed
                ) {


                    showVictory();


                }


                return;


            }


            /* MAUVAIS ENDROIT */

            showWrongMark(
                point.x,
                point.y
            );


            showMessage(
                "Essaie encore ! Regarde bien les petits détails. 👀"
            );


            playWrongSound();


        }
    );


    /* =========================
       CERCLES PRÉCIS
    ========================== */

    function createMarker(
        area,
        className
    ) {


        const marker =
            document.createElement(
                "div"
            );


        marker.className =
            className;


        marker.style.left =
            area.left + "%";


        marker.style.top =
            area.top + "%";


        marker.style.width =
            area.width + "%";


        marker.style.height =
            area.height + "%";


        board.appendChild(
            marker
        );


        return marker;

    }


    function addFoundMarkers(
        diff
    ) {


        diff.areas.forEach(
            function(area) {


                const marker =
                    createMarker(
                        area.marker,
                        "found-marker"
                    );


                marker.dataset.difference =
                    diff.id;


            }
        );


    }


    function showWrongMark(
        x,
        y
    ) {


        const mark =
            document.createElement(
                "div"
            );


        mark.className =
            "wrong-mark";


        mark.textContent =
            "✕";


        mark.style.left =
            x + "%";


        mark.style.top =
            y + "%";


        board.appendChild(
            mark
        );


        setTimeout(
            function() {


                mark.remove();


            },
            750
        );


    }


    /* =========================
       PROGRESSION
    ========================== */

    function updateGame() {


        const count =
            found.size;


        counter.textContent =
            count +
            " / 7 différences trouvées";


        progressBar.style.width =
            (
                count /
                differences.length *
                100
            ) +
            "%";


        differences.forEach(
            function(diff, index) {


                const item =
                    document.getElementById(
                        "list-" +
                        diff.id
                    );


                if (
                    found.has(
                        diff.id
                    )
                ) {


                    item.classList.add(
                        "found"
                    );


                    item.textContent =
                        "✅ " +
                        diff.name;


                }

                else {


                    item.classList.remove(
                        "found"
                    );


                    item.textContent =
                        "Différence " +
                        (index + 1);


                }


            }
        );


        updateStars();


    }


    function updateStars() {


        let text =
            "";


        for (
            let i = 0;
            i < 3;
            i++
        ) {


            text +=
                i < stars
                ? "⭐"
                : "☆";


        }


        starsDisplay.textContent =
            text;


    }


    /* =========================
       INDICE
    ========================== */

    document.getElementById(
        "hint-button"
    ).addEventListener(
        "click",
        function() {


            const remaining =
                differences.filter(
                    function(diff) {


                        return !found.has(
                            diff.id
                        );


                    }
                );


            if (
                remaining.length === 0
            ) {


                showMessage(
                    "Tu as déjà tout trouvé ! 🎉"
                );


                return;


            }


            clearHints();


            if (
                stars > 1
            ) {


                stars--;


            }


            updateStars();


            const target =
                remaining[
                    Math.floor(
                        Math.random() *
                        remaining.length
                    )
                ];


            const side =
                target.areas[
                    Math.floor(
                        Math.random() * 2
                    )
                ];


            const marker =
                createMarker(
                    side.marker,
                    "hint-marker"
                );


            hintMarkers.push(
                marker
            );


            showMessage(
                "💡 Regarde bien la zone qui clignote !"
            );


            setTimeout(
                clearHints,
                2500
            );


        }
    );


    function clearHints() {


        hintMarkers.forEach(
            function(marker) {


                marker.remove();


            }
        );


        hintMarkers =
            [];


    }


    /* =========================
       VOIR LES RÉPONSES
    ========================== */

    document.getElementById(
        "answers-button"
    ).addEventListener(
        "click",
        function() {


            const confirmation =
                confirm(
                    "Veux-tu vraiment voir les 7 réponses ?"
                );


            if (
                !confirmation
            ) {


                return;


            }


            clearHints();


            answersRevealed =
                true;


            stars =
                1;


            differences.forEach(
                function(diff) {


                    if (
                        !found.has(
                            diff.id
                        )
                    ) {


                        found.add(
                            diff.id
                        );


                        addFoundMarkers(
                            diff
                        );


                    }


                }
            );


            updateGame();


            showMessage(
                "👀 Voici les 7 différences !"
            );


        }
    );


    /* =========================
       RECOMMENCER
    ========================== */

    document.getElementById(
        "restart-button"
    ).addEventListener(
        "click",
        function() {


            const confirmation =
                confirm(
                    "Veux-tu recommencer le jeu ?"
                );


            if (
                !confirmation
            ) {


                return;


            }


            found.clear();


            stars =
                3;


            answersRevealed =
                false;


            clearHints();


            board
                .querySelectorAll(
                    ".found-marker, .wrong-mark"
                )
                .forEach(
                    function(marker) {


                        marker.remove();


                    }
                );


            victory.classList.remove(
                "show"
            );


            updateGame();


            showMessage(
                "C'est reparti ! Trouve les 7 différences. 🔎"
            );


        }
    );


    /* =========================
       VICTOIRE
    ========================== */

    function showVictory() {


        victory.classList.add(
            "show"
        );


        victory.innerHTML =
            "🎉 Bravo ! Tu as trouvé les 7 différences !<br>" +
            "<span style='font-size:1rem'>" +
            "Résultat : " +
            starsDisplay.textContent +
            "</span>";


        launchConfetti();


        playVictorySound();


    }


    /* =========================
       CONFETTIS
    ========================== */

    function launchConfetti() {


        const colors = [

            "#2F8F46",
            "#174E78",
            "#F1B83B",
            "#EC4899",
            "#8B5CF6",
            "#F97316"

        ];


        for (
            let i = 0;
            i < 70;
            i++
        ) {


            const piece =
                document.createElement(
                    "div"
                );


            piece.className =
                "confetti";


            piece.style.left =
                Math.random() *
                100 +
                "vw";


            piece.style.backgroundColor =
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ];


            piece.style.animationDelay =
                Math.random() *
                0.8 +
                "s";


            document.body.appendChild(
                piece
            );


            setTimeout(
                function() {


                    piece.remove();


                },
                4000
            );


        }


    }


    /* =========================
       SON
    ========================== */

    document.getElementById(
        "sound-button"
    ).addEventListener(
        "click",
        function() {


            soundEnabled =
                !soundEnabled;


            this.textContent =
                soundEnabled
                ? "🔊 Son activé"
                : "🔇 Son désactivé";


        }
    );


    function playTone(
        frequency,
        duration
    ) {


        if (
            !soundEnabled
        ) {


            return;


        }


        try {


            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;


            const audio =
                new AudioContext();


            const oscillator =
                audio.createOscillator();


            const gain =
                audio.createGain();


            oscillator.connect(
                gain
            );


            gain.connect(
                audio.destination
            );


            oscillator.frequency.value =
                frequency;


            oscillator.type =
                "sine";


            gain.gain.value =
                0.06;


            oscillator.start();


            gain.gain.exponentialRampToValueAtTime(
                0.001,
                audio.currentTime +
                duration
            );


            oscillator.stop(
                audio.currentTime +
                duration
            );


        }

        catch (error) {

        }


    }


    function playGoodSound() {


        playTone(
            620,
            0.15
        );


        setTimeout(
            function() {


                playTone(
                    820,
                    0.17
                );


            },
            100
        );


    }


    function playWrongSound() {


        playTone(
            190,
            0.22
        );


    }


    function playVictorySound() {


        const notes = [

            523,
            659,
            784,
            1046

        ];


        notes.forEach(
            function(note, index) {


                setTimeout(
                    function() {


                        playTone(
                            note,
                            0.27
                        );


                    },
                    index * 120
                );


            }
        );


    }


    /* =========================
       MESSAGE
    ========================== */

    function showMessage(
        text
    ) {


        message.textContent =
            text;


    }


    /* =========================
       INITIALISATION
    ========================== */

    updateGame();


</script>


</body>

</html>
